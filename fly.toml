# fly launch --copy-config --no-deploy   (then follow README → Deploy)
app = "onething-CHANGE-ME"          # must be globally unique
primary_region = "nrt"              # Tokyo, closest to Seoul. Use "ams" when back in Eindhoven.

[build]

[env]
  ONETHING_DATA = "/data"
  ONETHING_TZ = "Asia/Seoul"        # change to "Europe/Amsterdam" when back
  ONETHING_ICS_KEYWORDS = ""        # e.g. "deadline,exam,assignment,due" — empty = import everything

[mounts]
  source = "onething_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"       # sleeps when idle, wakes on request
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
